# Table Oracle evaluation set
#
# GENERATED -- do not hand-edit anchors. Regenerate with the builder in the
# repo history, which resolves each question's `locator` (a literal phrase from
# the SRD) against chunk text.
#
# Anchors are ground truth taken from the CORPUS, never from retrieval output.
# An eval whose expectations came from the retriever would only ever grade the
# system against itself. Writing this file caught 18 questions where the
# expected wording was recalled from memory rather than present in the corpus.
#
# Fields
#   question                 asked verbatim, exactly as a user would type it
#   expected_chunks          anchors that SHOULD be retrieved. Several are
#                            listed when the SRD repeats a rule (an index page
#                            and a detail page); citing either is correct.
#   expected_answer_contains substrings a correct answer should contain
#   should_abstain           true when the corpus genuinely cannot answer.
#                            These matter as much as the answerable ones: a
#                            system that never abstains has not solved
#                            grounding, it has hidden the problem.
#   tags                     for slicing results by area and difficulty


